upstream backend-api {
    server api:6868;
}

server {
    listen 80;
    server_name localhost evservicecenter.me www.evservicecenter.me;
    server_tokens off;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost evservicecenter.me www.evservicecenter.me;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/evservicecenter.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evservicecenter.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cloudflare real IP configuration (can be auto-updated)
    include /etc/nginx/conf.d/cloudflare-ips.conf;

    # Logging
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log;

    # Client body size limit (for file uploads)
    client_max_body_size 50M;

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;

    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts (increased for SignalR)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    # Redirect root to Swagger
    location = / {
        return 301 /swagger;
    }

    # SignalR Hub
    location /chatHub {
        proxy_pass http://backend-api;
        
        # Disable buffering for SignalR
        proxy_buffering off;
        proxy_cache off;
        
        # Long timeout for SignalR (override server-level timeout)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # All routes to backend (for Swagger and API)
    location / {
        proxy_pass http://backend-api;
        
        # Disable buffering for better performance
        proxy_buffering off;
    }
}
